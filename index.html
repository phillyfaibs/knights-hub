var TRK = { sid: '', page: '', since: 0, acc: {}, act: Date.now() };
function trkTick() {
if (!TRK.sid) return;
var now = Date.now();
if (TRK.since && TRK.page) {
var end = Math.min(now, TRK.act + 300000);
var s = Math.round((end - TRK.since) / 1000);
if (s > 0) TRK.acc[TRK.page] = (TRK.acc[TRK.page] || 0) + s;
}
TRK.page = S.route;
TRK.since = (document.hidden || now - TRK.act > 300000) ? 0 : now;
}
function trkPage() {
trkTick();
if (TRK.sid && TRK.acc[S.route] === undefined) TRK.acc[S.route] = 0;
}
function trkSend() {
if (!TRK.sid || !Object.keys(TRK.acc).length) return;
var add = TRK.acc;
TRK.acc = {};
api('track', { sid: TRK.sid, add: add }).catch(function () {});
}
function trkActive() { if (!window.TRK) return; TRK.act = Date.now(); if (!TRK.since && !document.hidden && TRK.sid) TRK.since = TRK.act; }
function trkInit() {
if (!S.model || !S.me || TRK.sid) return;
TRK.sid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
TRK.page = S.route; TRK.since = Date.now(); TRK.act = Date.now();
TRK.acc[S.route] = 0;
trkSend();
setInterval(function () { trkTick(); trkSend(); }, 60000);
['keydown', 'scroll', 'touchstart'].forEach(function (ev) { window.addEventListener(ev, trkActive); });
document.addEventListener('visibilitychange', function () {
if (document.hidden) { trkTick(); TRK.since = 0; trkSend(); }
else { TRK.act = Date.now(); TRK.since = TRK.act; }
});
}

}) : html`<p class="small muted">No changes logged yet.</p>`}
<p class="small muted">Full history is in the "Change log" tab of the team sheet.</p>
</div>
</div>`);
}
ACTIONS['activity-reload'] = function () { S.activity = null; drawActivity(); loadActivity(); };
ACTIONS['errors-clear'] = function () { api('admin.errors.clear').then(function () { toast('Errors cleared'); loadActivity(); }, function (e) { toast(e.message, 'error'); }); };

/* ---------- Welcome card for first-time visitors ---------- */
function welcomeDone() { return lsGet('kh_welcome_done') === '1'; }
function welcomeCard() {
if (welcomeDone()) return '';
var nm = S.me && S.me.name && S.me.name !== 'Owner' ? S.me.name.split(/[\s(]/)[0] : '';
var tiles = [
{ go: 'schedule', ic: 'calendar', t: 'Schedule', d: 'Dates, times and rinks' },
{ go: 'games', ic: 'puck', t: 'Games', d: 'Scores and who scored' },
{ go: 'awards', ic: 'trophy', t: 'Awards', d: 'This week’s winners' },
{ go: 'stats', ic: 'chart', t: 'Stats', d: 'Goals and assists' }
];
return html`<div class="card welcome">
<div class="welcome-head"><div><div class="eyebrow">Welcome${nm ? ', ' + nm : ''}</div>
<h2>Our season, all in one place</h2>
<p class="muted">Schedule, scores and weekly awards for the Golden Knights. It updates by itself, so check back after every game.</p></div>
<button class="icon-btn" data-act="welcome-close" aria-label="Hide welcome">${icon('x', 14)}</button></div>
<div class="wtiles">${tiles.map(function (x) { return html`<button class="wtile" data-go="${x.go}"><span class="wi">${icon(x.ic, 17)}</span><span class="wt"><b>${x.t}</b><span class="wd">${x.d}</span></span></button>`; })}</div>
<div class="wtips">
<div class="d-only">${icon('home', 16)}<span>Use the menu on the left to get around.</span></div>
<div class="m-only">${icon('star', 16)}<span>Tip: tap your browser's Share or menu button, then Add to Home Screen. It opens like an app.</span></div>
<div>${icon('lock', 16)}<span>Private to team families. ${S.coach ? 'Parents see players by jersey number and first name only.' : 'Players are shown by jersey number and first name only.'}</span></div>
</div>
<div class="welcome-foot"><span class="small muted">Questions? Ask Coach Phil.</span><button class="btn gold small" data-act="welcome-close">Got it</button></div>
</div>`;
}
ACTIONS['sign-out'] = function () {
sessClear();
try { google.accounts.id.disableAutoSelect(); } catch (e) { /* fine */ }
S.model = null; S.me = null; S.prompted = true; S.signErr = ''; S.needSignIn = true; render();
};
ACTIONS['welcome-close'] = function () { lsSet('kh_welcome_done', '1'); render(); };
ACTIONS['welcome-open'] = function () { lsSet('kh_welcome_done', null); go('home'); };
</script>
