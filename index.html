/* =====================================================================
Knights Hub: the Capacity Hub liquid-glass system, recoloured for the
Vaughan Golden Knights (gold, steel grey, red, black).
NOTE: never write two slashes in a row in this file.
===================================================================== */
:root {
--gold: #B4975A; --gold-2: #D4BC85; --steel: #333F48; --steel-2: #5B6670; --red: #C8102E; --black: #111111;
--spring: cubic-bezier(.34, 1.4, .5, 1); --ease: cubic-bezier(.22, 1, .36, 1);
--font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
--txt: #15191C; --txt-dim: #5F6870;
--glass: rgba(255,255,255,.66); --glass-2: rgba(255,255,255,.46); --glass-strong: rgba(252,251,248,.94);
--stroke: rgba(255,255,255,.8); --stroke-2: rgba(17,17,17,.08); --spec: rgba(255,255,255,.95);
--shadow: 0 10px 34px rgba(30,30,20,.14); --field: rgba(255,255,255,.6); --hover: rgba(255,255,255,.7);
--bg:
radial-gradient(1000px 600px at 10% -10%, rgba(180,151,90,.42), transparent 62%),
radial-gradient(900px 560px at 92% 6%, rgba(91,102,112,.28), transparent 60%),
radial-gradient(900px 640px at 50% 110%, rgba(200,16,46,.14), transparent 62%),
linear-gradient(168deg, #F7F4EC 0%, #EFEAE0 52%, #E8E4DC 100%);
--a-jersey: #B4975A; --a-jersey-ink: #111111;
--a-chain: #333F48; --a-chain-ink: #FFFFFF;
--a-shield: #C8102E; --a-shield-ink: #FFFFFF;
--win: #8A6D2F; --loss: #B00E28; --tie: #4A5560;
--track: rgba(17,17,17,.08);
--accent: #8A6D2F;
}
@media (prefers-color-scheme: dark) {
:root:not([data-theme="light"]) {
--txt: #F1EEE6; --txt-dim: #A3A9AE;
--glass: rgba(34,40,46,.58); --glass-2: rgba(24,29,34,.46); --glass-strong: rgba(22,26,30,.95);
--stroke: rgba(255,255,255,.12); --stroke-2: rgba(255,255,255,.08); --spec: rgba(255,255,255,.22);
--shadow: 0 14px 44px rgba(0,0,0,.5); --field: rgba(255,255,255,.06); --hover: rgba(255,255,255,.08);
--bg:
radial-gradient(1000px 600px at 10% -10%, rgba(180,151,90,.32), transparent 62%),
radial-gradient(900px 560px at 92% 6%, rgba(91,102,112,.3), transparent 58%),
radial-gradient(900px 640px at 50% 110%, rgba(200,16,46,.18), transparent 60%),
linear-gradient(168deg, #0B0D0F 0%, #12161A 52%, #0E1114 100%);
--a-chain: #7D8A95; --a-chain-ink: #0B0D0F;
--win: #D4BC85; --loss: #FF6B7F; --tie: #A3A9AE;
--track: rgba(255,255,255,.08);
--accent: #D4BC85;
}
}
:root[data-theme="dark"] {
--txt: #F1EEE6; --txt-dim: #A3A9AE;
--glass: rgba(34,40,46,.58); --glass-2: rgba(24,29,34,.46); --glass-strong: rgba(22,26,30,.95);
--stroke: rgba(255,255,255,.12); --stroke-2: rgba(255,255,255,.08); --spec: rgba(255,255,255,.22);

--a-chain: #7D8A95; --a-chain-ink: #0B0D0F;
--win: #D4BC85; --loss: #FF6B7F; --tie: #A3A9AE;
--track: rgba(255,255,255,.08);
--accent: #D4BC85;
}
* { box-sizing: border-box; }
html { background: #EFEAE0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { background: #0B0D0F; } }
:root[data-theme="dark"] { background: #0B0D0F; }
body {
margin: 0; min-height: 100vh; color: var(--txt); background: var(--bg); background-attachment: fixed;
font: 14px/1.45 var(--font); font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
h1 { font-size: 22px; font-weight: 800; letter-spacing: -.03em; margin: 0; line-height: 1.15; }
h2 { font-size: 16px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
.muted { color: var(--txt-dim); }
.small { font-size: 12px; }
.orb { position: fixed; border-radius: 50%; filter: blur(60px); opacity: .5; pointer-events: none; z-index: 0; }
.orb-a { width: 420px; height: 420px; background: var(--gold); top: -140px; left: -120px; animation: drift 22s ease-in-out infinite alternate; }
.orb-b { width: 360px; height: 360px; background: var(--steel-2); top: 30%; right: -160px; animation: drift 26s ease-in-out infinite alternate-reverse; }
.orb-c { width: 300px; height: 300px; background: var(--red); bottom: -160px; left: 30%; opacity: .22; animation: drift 30s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(40px, 30px) scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .orb { animation: none; } }
.shell { position: relative; z-index: 1; display: flex; min-height: 100vh; }
.sidebar {
position: sticky; top: 0; height: 100vh; width: 236px; flex: none; padding: 18px 14px; display: flex; flex-direction: column; gap: 18px;
background: var(--glass-2); border-right: 1px solid var(--stroke); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
}
.side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
.mark {
width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none;
background: linear-gradient(150deg, #1A1D20, #000); color: var(--gold); font-weight: 900; letter-spacing: -.04em; font-size: 15px;
box-shadow: inset 0 0 0 1.5px var(--gold), 0 6px 16px rgba(0,0,0,.25);
}
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-text strong { font-size: 15px; letter-spacing: -.02em; }
.brand-text span { font-size: 10px; letter-spacing: .08em; color: var(--txt-dim); text-transform: uppercase; }
.side-nav { display: flex; flex-direction: column; gap: 3px; }
.side-item {
display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 0; background: transparent;
cursor: pointer; font-weight: 650; color: var(--txt-dim); text-align: left; transition: background .2s var(--ease), color .2s;
}
.side-item:hover { background: var(--hover); color: var(--txt); }
.side-item.active { background: var(--glass); color: var(--txt); box-shadow: inset 0 0 0 1px var(--stroke), 0 4px 14px rgba(0,0,0,.08); }
.side-item.active svg { color: var(--accent); }

var TRK = { sid: '', page: '', since: 0, acc: {}, act: Date.now() };
function trkTick() {

var now = Date.now();
if (TRK.since && TRK.page) {
var end = Math.min(now, TRK.act + 300000);
var s = Math.round((end - TRK.since) / 1000);
if (s > 0) TRK.acc[TRK.page] = (TRK.acc[TRK.page] || 0) + s;
}
TRK.page = S.route;
TRK.since = (document.hidden || now - TRK.act > 300000) ? 0 : now;
}
function trkPage() {
trkTick();
if (TRK.sid && TRK.acc[S.route] === undefined) TRK.acc[S.route] = 0;
}
function trkSend() {
if (!TRK.sid || !Object.keys(TRK.acc).length) return;
var add = TRK.acc;
TRK.acc = {};
api('track', { sid: TRK.sid, add: add }).catch(function () {});
}
function trkActive() { if (!window.TRK) return; TRK.act = Date.now(); if (!TRK.since && !document.hidden && TRK.sid) TRK.since = TRK.act; }
function trkInit() {
if (!S.model || !S.me || TRK.sid) return;
TRK.sid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
TRK.page = S.route; TRK.since = Date.now(); TRK.act = Date.now();
TRK.acc[S.route] = 0;
trkSend();
setInterval(function () { trkTick(); trkSend(); }, 60000);
['keydown', 'scroll', 'touchstart'].forEach(function (ev) { window.addEventListener(ev, trkActive); });
document.addEventListener('visibilitychange', function () {
if (document.hidden) { trkTick(); TRK.since = 0; trkSend(); }
else { TRK.act = Date.now(); TRK.since = TRK.act; }
});
}

<p class="small muted">Full history is in the "Change log" tab of the team sheet.</p>

${S.coach ? html`<label class="field gap" id="sn-email-wrap">Parent email(s) for the reminder<input id="sn-email" type="email" multiple value="${s && s.remind ? s.remind : ''}" placeholder="parent@gmail.com, other.parent@gmail.com"><span class="small muted" style="font-weight:500">This family hasn't linked a parent account yet, so the hub doesn't know where to send their reminder. Add one or more emails, or leave it blank and the reminder comes to Coach Phil to forward.</span></label>` : ''}
<div class="note gap">${S.coach ? (s ? 'Signed up by ' + (s.by || 'a parent') + '. ' : '') + 'Coaches can change or clear this any time.' : 'Your family brings snacks for the whole team that day. Once you sign up, only a coach can change it, so message a coach if plans change.'}</div>

var em = ew && ew.style.display !== 'none' ? d.querySelector('#sn-email').value.trim() : '';
if (!S.coach && !pid) { toast('Pick your player first', 'error'); return; }
if (S.coach && !pid && !s) { closeDrawer(); return; }
btn.disabled = true; btn.textContent = 'Saving...';
if (!S.coach && !mePlayers().length) lsSet('kh_family', String(pid));
api(S.coach ? 'snack.set' : 'snack.claim', { ymd: e.ymd, start: e.start, player: pid, email: em }).then(function (m) {
setModel(m); S.dirty = true; closeDrawer();
toast(pid ? 'Thanks! ' + player(pid).first + "'s family has snacks on " + p.mon + ' ' + p.day : 'Snack date cleared');
}, function (err) {

});

});
}

})}</div>
<div class="gap"><button class="btn gold wide" id="pp-save">Save</button></div>
${first ? html`<p class="small muted" style="text-align:center;margin:12px 0 0">Questions? Ask Coach Phil.</p>` : ''}`, function (d) {

this.disabled = true; this.textContent = 'Saving...';
save({ players: ids }, 'Thanks! Saved ' + ids.map(function (id) { return player(id).first; }).join(' and ') + ' as your player');
};
});
}
PAGES.mine = function () {
var ids = mePlayers();
if (!ids.length) {
setTimeout(maybeAskPlayer, 0);
return html`<div class="page-head"><div><h1>My player</h1><p>Pick your player to see their stats here.</p></div></div>
<div class="card empty"><button class="btn gold" data-act="my-player">${icon('jersey', 16)} Pick my player</button></div>`;
}
if (ids.indexOf(S.minePick) === -1) S.minePick = ids[0];
var id = S.minePick, p = player(id);
var st = skaterStats().filter(function (s) { return s.id === id; })[0] || { g: 0, a: 0, pts: 0, pim: 0, st: 0 };
var aw = awardCounts()[id] || { jersey: 0, chain: 0, shield: 0, total: 0 };
var myAwards = S.model.awards.filter(function (a) { return a.player === id; });
var played = S.model.games.filter(function (g) { return g.played; });
var hidden = played.some(function (g) { return g.statsHidden; }) && !S.coach;
var gl = goalieStats().filter(function (g) { return g.id === id; })[0];
var snacks = (S.model.snacks || []).filter(function (s) { return s.player === id; }).sort(function (a, b) { return a.ymd < b.ymd ? -1 : 1; });
var rows = played.map(function (g) {
var l = g.lines.filter(function (x) { return x.player === id; })[0] || { g: 0, a: 0, pim: 0 };
return { g: g, l: l, inNet: g.goalie === id, started: S.coach && g.starters && g.starters.d.concat(g.starters.f).indexOf(id) >= 0 };
});
return html`
<div class="page-head"><div><h1>${pname(p, true)}</h1><p>#${p.num} · My player</p></div>
${ids.length > 1 ? html`<div class="segmented">${ids.map(function (x) { return html`<button class="${x === id ? 'on' : ''}" data-act="mine-pick" data-id="${x}">${player(x).first}</button>`; })}</div>` : html`<button class="btn small" data-act="my-player">Change</button>`}</div>
<div class="grid g2">

<div class="card tile"><div class="k">Awards</div><div class="v">${aw.total}</div><div class="s">${aw.jersey} Jersey · ${aw.chain} Chain · ${aw.shield} Shield</div></div>
</div>
<div class="grid g2 gap">
<div class="card"><div class="card-head"><h2>${icon('chart')} Game by game</h2>${S.coach ? html`<span class="chip">${st.st} starts</span>` : ''}</div>
${rows.length ? html`<div class="table-wrap"><table><thead><tr><th>Game</th><th class="num">Goals</th></tr></thead><tbody>
${rows.slice().reverse().map(function (r) { var gp = ymdParts(r.g.ymd); return html`<tr class="tap" data-act="game" data-col="${r.g.col}"><td><b>${r.g.title}</b>${r.g.opp ? ' vs ' + r.g.opp : ''}<div class="small muted">${gp ? gp.dow + ' ' + gp.mon + ' ' + gp.day : ''} · ${resultWord(r.g.result)} ${r.g.gf}-${r.g.ga}${r.inNet ? ' · In net' : ''}${r.started ? ' · Started' : ''}</div></td><td class="num big">${r.l.g}</td></tr>`; })}
</tbody></table></div>` : html`<p class="muted">Stats show here after the first game sheet is filled in.</p>`}
</div>
<div>
<div class="card"><div class="card-head"><h2>${icon('trophy')} Awards</h2></div>
${myAwards.length ? html`<div class="rows">${myAwards.map(function (a) { var d = dayByCol(a.day), dp = d ? ymdParts(d.ymd) : null; return html`<div class="row">${awardIcon(a.award)}<div class="grow">${awardDef(a.award).short}<div class="small muted">${dp ? dp.dow + ' ' + dp.mon + ' ' + dp.day : (d ? d.label : '')}${d ? ' · ' + kindLabel(d) : ''}</div></div></div>`; })}</div>` : html`<p class="muted">No awards yet. Keep moving those feet!</p>`}

${gl ? html`<div class="card gap"><div class="card-head"><h2>${icon('goalie')} In net</h2></div><div class="small">${gl.gp} ${gl.gp === 1 ? 'game' : 'games'} · ${gl.w}-${gl.l}-${gl.t}${gl.so ? ' · ' + gl.so + ' shutout' + (gl.so === 1 ? '' : 's') : ''} · ${gl.ga} goals against · GAA ${gl.gaa === null ? '-' : gl.gaa.toFixed(2)}</div></div>` : ''}

${snacks.length ? html`<div class="rows">${snacks.map(function (s) { var sp = ymdParts(s.ymd); var e = (S.model.schedule || []).filter(function (x) { return x.ymd === s.ymd && x.start === s.start; })[0]; return html`<div class="row ${s.ymd < S.model.today ? 'muted' : ''}"><span class="jn sm">${sp.day}</span><div class="grow">${sp.dow} ${sp.mon} ${sp.day}${s.start ? ' · ' + s.start : ''}<div class="small muted">${e ? eventTitle(e) : ''}</div></div></div>`; })}</div>` : html`<p class="muted">No snack dates yet. Families pick 2 or 3 on the Schedule page.</p>`}
</div>
</div>
</div>
${hidden ? html`<p class="small muted gap">Only you and the coaches can see your player's points.</p>` : ''}`;
};

/* ---------- League standings, read nightly from the CVHA site by the data service ---------- */
function ordinal(n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function ourStanding() {
var st = S.model.standings;
if (!st || !st.rows) return null;
for (var i = 0; i < st.rows.length; i++) { if (/golden knights/i.test(st.rows[i].team)) return { rank: i + 1, of: st.rows.length, row: st.rows[i] }; }
return null;
}
function standingLine() {
var o = ourStanding();
if (!o || !o.row.gp) return '';
return html`<div class="small" style="margin:10px 0 0;color:var(--gold-2);font-weight:750;cursor:pointer" data-go="games">${icon('trophy', 13)} ${ordinal(o.rank)} of ${o.of} in the league · ${o.row.pts} pts</div>`;
}
function standingsCard() {
var st = S.model.standings;
if (!st || !st.rows || !st.rows.length) return '';
var none = st.rows.every(function (r) { return !r.gp; });
var src = 'https:' + '/' + '/vaughanhockey.com/Leagues/5325/Standings/';
return html`<div class="card"><div class="card-head"><h2>${icon('trophy')} League standings</h2><span class="small muted">${st.at ? 'Updated ' + timeAgo(st.at) : ''}</span></div>
<div class="table-wrap"><table><thead><tr><th class="num">#</th><th>Team</th><th class="num">GP</th><th class="num">W</th><th class="num">L</th><th class="num">T</th><th class="num">PTS</th><th class="num">GF</th><th class="num">GA</th><th class="num">+/-</th><th class="num">Streak</th></tr></thead><tbody>
${st.rows.map(function (r, i) { var us = /golden knights/i.test(r.team); return html`<tr class="${us ? 'lead' : ''}"><td class="num">${i + 1}</td><td>${us ? html`<b>${r.team}</b>` : r.team}</td><td class="num">${r.gp}</td><td class="num">${r.w}</td><td class="num">${r.l}</td><td class="num">${r.t}</td><td class="num big">${r.pts}</td><td class="num">${r.gf}</td><td class="num">${r.ga}</td><td class="num">${r.diff > 0 ? '+' : ''}${r.diff}</td><td class="num">${r.strk || '-'}</td></tr>`; })}
</tbody></table></div>
<div class="small muted" style="margin-top:8px">${none ? 'Regular season games start Sun Nov 1. Exhibition games don\'t count toward the standings. ' : ''}From the CVHA league site, checked every night. <a href="${src}" target="_blank" rel="noopener" style="color:var(--accent)">See it on vaughanhockey.com</a></div></div>`;
}
function startCounts(exceptCol) {
var c = {};
S.model.games.forEach(function (g) { if (g.col === exceptCol || !g.starters) return; g.starters.d.concat(g.starters.f).forEach(function (id) { c[id] = (c[id] || 0) + 1; }); });
return c;
}
function eventMins(e) {
var m = String(e.start || '').match(/(\d{1,2}):(\d{2})\s*([AP])M/i);
if (!m) return null;
return (Number(m[1]) % 12 + (/p/i.test(m[3]) ? 12 : 0)) * 60 + Number(m[2]);
}
function nowMins() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function eventOver(e) {
if (!S.model || e.ymd !== S.model.today) return false;
var st = eventMins(e);
return st !== null && nowMins() >= st + 60;
}
function eventNow(e) {
if (!S.model || e.ymd !== S.model.today) return false;
var st = eventMins(e);
return st !== null && nowMins() >= st && nowMins() < st + 60;
}
ACTIONS['welcome-close'] = function () { lsSet('kh_welcome_done', '1'); render(); };
ACTIONS['welcome-open'] = function () { lsSet('kh_welcome_done', null); go('home'); };
